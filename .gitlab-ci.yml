# GitLab CI for the Hyperswitch fork.
#
# Stages run fast -> slow -> publish, so cheap checks fail before expensive ones:
#   1. lint        — fast, no workspace compile (fmt, secret detection).
#   2. analyze     — compile-heavy Rust gates (clippy, cargo audit); run after
#                    lint passes.
#   3. image-build — build the four deployable container images (router,
#                    producer, consumer, drainer) from the root Dockerfile and
#                    push them to AWS ECR in each CDE environment.
#
# Image build model mirrors the CDE house pattern (see card-bin-loader in the
# deploy repo):
#   * No static AWS keys. Each job assumes a per-account role (TERRAFORM_ROLE_ARN
#     -> EC2_Runner) via `aws sts assume-role`, using the runner's own identity.
#   * ECR repos are auto-created (MUTABLE, scan-on-push) if missing.
#   * dind builds run on the privileged eng runners (docker+qa / docker+prod),
#     not the non-privileged cde-* runners. The target ECR account is selected
#     by the assumed role, independent of which runner builds. This assumes the
#     eng runner can assume the CDE EC2_Runner role; if it cannot, the ECR push
#     (not the build) will fail and we'd need a Kaniko step on a cde-* runner.
#
# Unlike card-bin-loader (light python image, built per-env with Kaniko), these
# are heavy Rust builds, so each job builds all four images once against a single
# dind daemon — the shared builder stage compiles the workspace a single time and
# is reused for the other three images.

include:
  # Language-agnostic secret scanning. GitLab's managed SAST has no Rust
  # analyzer, so Rust static analysis is covered by clippy + cargo audit below.
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - lint
  - analyze
  - image-build

variables:
  AWS_DEFAULT_REGION: eu-west-1
  # cargo feature set passed to the Dockerfile builder stage (v1 or v2).
  VERSION_FEATURE_SET: "v1"

# ---------------------------------------------------------------------------
# lint / analyze — MR quality gates (run on every merge request and on main)
# ---------------------------------------------------------------------------

# Run the Rust gates on every merge request and on main (never on schedules).
.rust-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

.rust-job:
  extends: .rust-rules
  # Default stage for the compile-heavy gates; fmt overrides to `lint`.
  stage: analyze
  image: public.ecr.aws/docker/library/rust:trixie
  variables:
    CARGO_INCREMENTAL: "0"
    CARGO_NET_RETRY: "10"
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - target/
  before_script:
    - apt-get update && apt-get install -y libpq-dev libssl-dev pkg-config protobuf-compiler jq curl

fmt:
  extends: .rust-job
  stage: lint
  # rustfmt only — no workspace compile, so skip the heavy cache/deps.
  cache: []
  before_script:
    - rustup toolchain install nightly --component rustfmt --profile minimal
  script:
    - cargo +nightly fmt --all --check

clippy:
  extends: .rust-job
  before_script:
    - apt-get update && apt-get install -y libpq-dev libssl-dev pkg-config protobuf-compiler jq curl
    - rustup component add clippy
    - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
  script:
    # Reuse the repo's own recipes so the feature set matches local/dev clippy.
    - just clippy "redis-rs" -- -D warnings
    - just clippy_v2 "redis-rs"

cargo-audit:
  extends: .rust-job
  # Non-blocking to start: the upstream dependency tree will surface existing
  # RUSTSEC advisories. Triage them (or add `--ignore RUSTSEC-xxxx`) and flip
  # this to blocking once the baseline is clean.
  allow_failure: true
  cache:
    key: cargo-audit
    paths:
      - .cargo/
  before_script:
    - cargo install cargo-audit --locked
  script:
    - cargo audit

# Run Secret Detection on merge requests (the template defaults to branch pipelines).
secret_detection:
  stage: lint
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Assume the environment role and log the docker CLI into that account's ECR.
# Runs in before_script; exported creds persist into the script step (same shell).
.assume-role-and-ecr-login: &assume-role-and-ecr-login
  - apk add --no-cache aws-cli bash jq
  - |
    set -euo pipefail
    echo "Waiting for dind..."
    until docker info >/dev/null 2>&1; do sleep 1; done
    : "${TERRAFORM_ROLE_ARN:?TERRAFORM_ROLE_ARN required for ${CI_ENVIRONMENT_NAME}}"
    SESSION_NAME="${TERRAFORM_SESSION_NAME:-gitlab-ci-hyperswitch-images-${CI_PIPELINE_ID}}"
    echo "Assuming role: $TERRAFORM_ROLE_ARN (session $SESSION_NAME)"
    TEMP_ROLE=$(aws sts assume-role \
      --role-arn "$TERRAFORM_ROLE_ARN" \
      --role-session-name "$SESSION_NAME" \
      --duration-seconds 3600 \
      --output json)
    AWS_ACCESS_KEY_ID=$(echo "$TEMP_ROLE" | jq -r .Credentials.AccessKeyId)
    AWS_SECRET_ACCESS_KEY=$(echo "$TEMP_ROLE" | jq -r .Credentials.SecretAccessKey)
    AWS_SESSION_TOKEN=$(echo "$TEMP_ROLE" | jq -r .Credentials.SessionToken)
    export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
    ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    export ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    echo "Logging in to ${ECR_REGISTRY}"
    aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
      | docker login --username AWS --password-stdin "$ECR_REGISTRY"

.build-images:
  stage: image-build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    # dind config proven on our runners (mirrors card-bin-loader): plain TCP on
    # 2375 with TLS disabled. The TLS-on-2376 setup needs a shared /certs volume
    # between the service and job containers that these runners don't provide, so
    # its health check times out ("Waiting for dind..." hangs).
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    CI_SERVICES_WAIT_FOR_TIMEOUT: "120"
  before_script:
    - *assume-role-and-ecr-login
  script:
    - bash ci/build-images.sh

# QA builds on merge requests and main (matches card-bin-loader QA rules).
.rules-qa:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Sandbox / prod build on main and tags only (never on MRs or schedules).
.rules-main-only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

build-images:cde-qa:
  extends:
    - .build-images
    - .rules-qa
  # dind builds run on the privileged eng runners (docker+qa/prod), NOT the
  # non-privileged cde-* runners — mirrors card-bin-loader:build. The target ECR
  # account is chosen by TERRAFORM_ROLE_ARN below, independent of the runner.
  tags:
    - docker
    - qa
  variables:
    CI_ENVIRONMENT_NAME: cde-qa
    TERRAFORM_ROLE_ARN: "arn:aws:iam::349829657212:role/EC2_Runner"
    TERRAFORM_SESSION_NAME: "HyperswitchImages-QA-${CI_PIPELINE_ID}"
  environment:
    name: cde-qa
    action: prepare

build-images:cde-sandbox:
  extends:
    - .build-images
    - .rules-main-only
  tags:
    - docker
    - prod
  variables:
    CI_ENVIRONMENT_NAME: cde-sandbox
    TERRAFORM_ROLE_ARN: "arn:aws:iam::699663557621:role/EC2_Runner"
    TERRAFORM_SESSION_NAME: "HyperswitchImages-Sandbox-${CI_PIPELINE_ID}"
  environment:
    name: cde-sandbox
    action: prepare

build-images:cde-prod:
  extends:
    - .build-images
    - .rules-main-only
  tags:
    - docker
    - prod
  variables:
    CI_ENVIRONMENT_NAME: cde-prod
    TERRAFORM_ROLE_ARN: "arn:aws:iam::968724509936:role/EC2_Runner"
    TERRAFORM_SESSION_NAME: "HyperswitchImages-Prod-${CI_PIPELINE_ID}"
  environment:
    name: cde-prod
    action: prepare
