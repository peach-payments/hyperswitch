# GitLab CI for the Hyperswitch fork.
#
# Three stages:
#   1. validate — Rust static-analysis (rustfmt, clippy) in one job, plus
#                 GitLab's managed secret detection as its own separate job.
#   2. build    — build the four container images (router, producer, consumer,
#                 drainer) ONCE and push them to the GitLab Container Registry.
#                 One Docker daemon => the shared builder stage compiles the
#                 workspace a single time and is reused for the other three.
#   3. release  — one job per CDE env: pull the built images from the GitLab
#                 registry, assume that account's role and push them to its ECR.
#
# Release model mirrors the CDE house pattern (see card-bin-loader in the deploy
# repo):
#   * No static AWS keys. Each release job assumes a per-account role
#     (TERRAFORM_ROLE_ARN -> EC2_Runner) via `aws sts assume-role`.
#   * ECR repos are auto-created (MUTABLE, scan-on-push) if missing.
#   * Docker work uses a docker:dind service on the privileged cde-* runners
#     (DOCKER_HOST -> the service). Target ECR account = the assumed role.

include:
  # GitLab-managed secret detection — runs as its own separate job.
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - build
  - release

variables:
  AWS_DEFAULT_REGION: eu-west-1
  # cargo feature set passed to the Dockerfile builder stage (v1 or v2).
  VERSION_FEATURE_SET: "v1"
  # Docker Hub auth for pulling docker / docker-dind images.
  DOCKER_AUTH_CONFIG: '{ "auths": { "https://index.docker.io/v1/": { "auth": "$DOCKER_AUTH" } }}'

# ---------------------------------------------------------------------------
# validate — static analysis + security gates (run on every merge request and main)
# ---------------------------------------------------------------------------

# rustfmt + clippy in one job so the image, apt deps, toolchain and cargo
# registry are set up once. Ordered cheap -> expensive: a formatting failure
# short-circuits the workspace clippy compile (GitLab runs each line under set
# -e). Secret scanning runs separately via the managed secret_detection job.
# static-analysis:
#   stage: validate
#   image: public.ecr.aws/docker/library/rust:trixie
#   rules:
#     - if: $CI_PIPELINE_SOURCE == "schedule"
#       when: never
#     - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#     - if: $CI_COMMIT_BRANCH == "main"
#   variables:
#     CARGO_INCREMENTAL: "0"
#     CARGO_NET_RETRY: "10"
#     CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
#   cache:
#     key:
#       files:
#         - Cargo.lock
#     paths:
#       - .cargo/
#       - target/
#   before_script:
#     - apt-get update && apt-get install -y libpq-dev libssl-dev pkg-config protobuf-compiler jq curl
#     - rustup component add clippy
#     - rustup toolchain install nightly --component rustfmt --profile minimal
#     - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
#   script:
#     - echo "=== rustfmt ===" && cargo +nightly fmt --all --check
#     # Reuse the repo's own recipes so the feature set matches local/dev clippy.
#     - echo "=== clippy (v1 + v2) ===" && just clippy "redis-rs" -- -D warnings && just clippy_v2 "redis-rs"

# GitLab-managed secret detection (from the included template), pinned to the
# validate stage and run on merge requests and main as its own separate job.
secret_detection:
  stage: validate
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Runs whenever any release could run: merge requests (for QA), main and tags.
.rules-build-and-qa:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Sandbox / prod release on main and tags only (never on MRs or schedules).
.rules-main-only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Docker-in-Docker on the privileged cde-* runners: a docker:dind service
# provides the daemon; DOCKER_HOST points at it and TLS is disabled so it
# listens on plain 2375. Mirrors card-bin-loader:build.
.dind:
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    CI_SERVICES_WAIT_FOR_TIMEOUT: "120"

# ---------------------------------------------------------------------------
# build — build once, push to the GitLab Container Registry (no AWS)
# ---------------------------------------------------------------------------
build-images:
  extends:
    - .dind
    - .rules-build-and-qa
  stage: build
  tags:
    - cde-qa
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - bash ci/build-images.sh

# ---------------------------------------------------------------------------
# release — per CDE env: pull from GitLab registry, assume role, push to ECR
# ---------------------------------------------------------------------------

# Assume the environment role and log docker in to that account's ECR.
# Exported creds/ECR_REGISTRY persist into the script step (same shell).
.assume-role-and-ecr-login: &assume-role-and-ecr-login
  - |
    set -euo pipefail
    : "${TERRAFORM_ROLE_ARN:?TERRAFORM_ROLE_ARN required for ${CI_ENVIRONMENT_NAME}}"
    SESSION_NAME="${TERRAFORM_SESSION_NAME:-gitlab-ci-hyperswitch-images-${CI_PIPELINE_ID}}"
    echo "Assuming role: $TERRAFORM_ROLE_ARN (session $SESSION_NAME)"
    TEMP_ROLE=$(aws sts assume-role \
      --role-arn "$TERRAFORM_ROLE_ARN" \
      --role-session-name "$SESSION_NAME" \
      --duration-seconds 3600 \
      --output json)
    AWS_ACCESS_KEY_ID=$(echo "$TEMP_ROLE" | jq -r .Credentials.AccessKeyId)
    AWS_SECRET_ACCESS_KEY=$(echo "$TEMP_ROLE" | jq -r .Credentials.SecretAccessKey)
    AWS_SESSION_TOKEN=$(echo "$TEMP_ROLE" | jq -r .Credentials.SessionToken)
    export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
    ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    export ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    echo "Logging in to ${ECR_REGISTRY}"
    aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
      | docker login --username AWS --password-stdin "$ECR_REGISTRY"

.release-ecr:
  extends: .dind
  stage: release
  needs:
    - job: build-images
  before_script:
    - apk add --no-cache aws-cli bash jq
    # Log in to the GitLab registry to pull the built images.
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - *assume-role-and-ecr-login
  script:
    - bash ci/release-ecr.sh

release:cde-qa:
  extends:
    - .release-ecr
    - .rules-build-and-qa
  tags:
    - cde-qa
  variables:
    CI_ENVIRONMENT_NAME: cde-qa
    TERRAFORM_ROLE_ARN: "arn:aws:iam::349829657212:role/EC2_Runner"
    TERRAFORM_SESSION_NAME: "HyperswitchImages-QA-${CI_PIPELINE_ID}"
  environment:
    name: cde-qa
    action: start

release:cde-sandbox:
  extends:
    - .release-ecr
    - .rules-main-only
  tags:
    - cde-sandbox
  variables:
    CI_ENVIRONMENT_NAME: cde-sandbox
    TERRAFORM_ROLE_ARN: "arn:aws:iam::699663557621:role/EC2_Runner"
    TERRAFORM_SESSION_NAME: "HyperswitchImages-Sandbox-${CI_PIPELINE_ID}"
  environment:
    name: cde-sandbox
    action: start

release:cde-prod:
  extends:
    - .release-ecr
    - .rules-main-only
  tags:
    - cde-prod
  variables:
    CI_ENVIRONMENT_NAME: cde-prod
    TERRAFORM_ROLE_ARN: "arn:aws:iam::968724509936:role/EC2_Runner"
    TERRAFORM_SESSION_NAME: "HyperswitchImages-Prod-${CI_PIPELINE_ID}"
  environment:
    name: cde-prod
    action: start
